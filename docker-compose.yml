name: receivables-dwh

# Source systems for the warehouse, plus the warehouse engine itself.
#   generator   -> writes synthetic CSV files to ./data_generator/output
#   sqlserver   -> the warehouse (and the simulated ERP source database, erp_source)
#   erp-loader  -> creates and fills erp_source from the CSV files
#   postgres    -> the simulated CRM source (loaded on first start)

services:
  generator:
    build:
      context: .
      dockerfile: data_generator/Dockerfile
    volumes:
      - ./data_generator/output:/out

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dwh_Local_Dev_1}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./data_generator/output:/seed:ro
    depends_on:
      generator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  erp-loader:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "${MSSQL_SA_PASSWORD:-Dwh_Local_Dev_1}" -i /sql/erp_source/01_create_and_load.sql
    restart: "no"

  # Creates the warehouse database, the control layer and the bronze objects.
  # Safe to run again: the scripts only create what is missing.
  dwh-setup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dwh_Local_Dev_1}
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for f in /sql/00_init/*.sql /sql/00_control/*.sql /sql/01_bronze/*.sql; do
          echo "== $$f"
          /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -i "$$f" || exit 1
        done
    restart: "no"

  # Python extractors. Not started by `docker compose up`; run on demand:
  #   docker compose run --rm extractors python -m extractors.ecommerce
  # ./extractors is mounted, so you edit on your machine and the container runs your latest code.
  extractors:
    build:
      context: .
      dockerfile: extractors/Dockerfile
    profiles: ["tools"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dwh_Local_Dev_1}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-shop_local_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_local_dev}
      DWH_HOST: sqlserver
      SHOP_HOST: mariadb
      CRM_HOST: postgres
    volumes:
      - ./extractors:/app/extractors
    depends_on:
      dwh-setup:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # dbt, for the silver and gold layers. Run on demand, for example:
  #   docker compose run --rm dbt debug
  # ./dbt is mounted, so you edit on your machine and the container runs your latest files.
  dbt:
    build:
      context: .
      dockerfile: dbt/Dockerfile
    profiles: ["tools"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dwh_Local_Dev_1}
    volumes:
      - ./dbt:/usr/app/dbt
    depends_on:
      dwh-setup:
        condition: service_completed_successfully

  # Metadata database for Airflow (DAG runs, task states). Separate from the CRM database.
  airflow-db:
    image: postgres:16-alpine
    profiles: ["orchestration"]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_local_dev}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Airflow, the orchestrator. `standalone` runs the API server, the scheduler and the
  # DAG processor in one container: fine for local development, not for production.
  # Start it with:  docker compose --profile orchestration up -d airflow
  # UI: http://localhost:8080 (no login: ALL_ADMINS is for local use only)
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    profiles: ["orchestration"]
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_local_dev}@airflow-db:5432/airflow
      # Passwords the pipeline tasks need (same names as the other services).
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dwh_Local_Dev_1}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-shop_local_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_local_dev}
      DWH_HOST: sqlserver
      SHOP_HOST: mariadb
      CRM_HOST: postgres
      DBT_PROFILES_DIR: /opt/airflow/project/dbt
      # Keep dbt's logs and build output out of the mounted project folder.
      DBT_LOG_PATH: /tmp/dbt/logs
      DBT_TARGET_PATH: /tmp/dbt/target
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/project/dbt
      - ./extractors:/opt/airflow/project/extractors
      - ./sql:/opt/airflow/project/sql:ro
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-db:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/crm_source:/docker-entrypoint-initdb.d:ro
      - ./data_generator/output:/seed:ro
    depends_on:
      generator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ecommerce
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-shop_local_dev}
    ports:
      - "3306:3306"
    volumes:
      - maria-data:/var/lib/mysql
      - ./sql/ecommerce_source:/docker-entrypoint-initdb.d:ro
      - ./data_generator/output:/seed:ro
    depends_on:
      generator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mssql-data:
  pg-data:
  maria-data:
  airflow-db-data:
  airflow-logs:
