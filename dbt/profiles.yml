receivables_dwh:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: sqlserver
      port: 1433
      database: dwh
      schema: dbo
      user: sa
      password: "{{ env_var('MSSQL_SA_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 4