version: 2

models:
  - name: dim_customer
    description: Una fila por cliente, con crédito, plazo de pago, distrito y cobrador.
    columns:
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - unique
          - not_null
      - name: collector_name
        description: Nombre del cobrador asignado al cliente, desde erp_employees.
        data_tests:
          - not_null
      - name: payment_terms_days
        description: Días de plazo de pago del cliente, desde erp_payment_terms.
        data_tests:
          - not_null
  - name: dim_customer_credit_history
    description: Una fila por cliente y versión de crédito, con fecha de vigencia (SCD2).
    columns:
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: valid_from
        description: Fecha desde la cual es válida la versión de crédito.
        data_tests:
          - not_null
      - name: valid_to
        description: Fecha hasta la cual es válida la versión de crédito.
        data_tests:
          - not_null
      - name: is_current
        description: Indica si la versión de crédito es la actual (1) o no (0).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
  - name: fact_invoice
    description: Una fila por factura, con cliente, fecha, importe y moneda.
    columns:
      - name: invoice_doc
        description: Número de documento de la factura en el ERP.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: invoice_date
        description: Fecha de la factura.
        data_tests:
          - not_null
      - name: invoice_amount
        description: Importe total de la factura en la moneda original.
        data_tests:
          - not_null
      - name: currency
        description: Código de moneda de la factura (ISO 4217).
        data_tests:
          - not_null
      - name: aging_bucket
        description: Categoría de antigüedad de la factura según su fecha y la fecha de corte.
        data_tests:
          - accepted_values:
              arguments:
                values: ['cleared', 'not_due', '1-15', '16-30', '31-60', '60+']
  - name: fact_credit_memo
    description: Una fila por nota de crédito, con cliente, fecha, importe y moneda.
    columns:
      - name: credit_memo_doc
        description: Número de documento de la nota de crédito en el ERP.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: credit_memo_date
        description: Fecha de la nota de crédito.
        data_tests:
          - not_null
      - name: credit_memo_amount
        description: Importe total de la nota de crédito en la moneda original.
        data_tests:
          - not_null
      - name: currency
        description: Código de moneda de la nota de crédito (ISO 4217).
        data_tests:
          - not_null
      - name: billing_doc
        description: Número de documento de facturación asociado a la nota de crédito.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_invoice')
                field: billing_doc
  - name: fact_payment
    description: Una fila por pago.
    columns:
      - name: payment_doc
        description: Número de documento del pago en el ERP.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: payment_date
        description: Fecha del pago.
        data_tests:
          - not_null
      - name: payment_amount
        description: Importe total del pago en la moneda original.
        data_tests:
          - not_null
      - name: currency
        description: Código de moneda del pago (ISO 4217).
        data_tests:
          - not_null
  - name: bridge_payment_application
    description: Una fila por aplicación de pago a factura o nota de crédito, con el documento de compensación.
    columns:
      - name: application_doc
        description: Número de documento de compensación en el ERP.
        data_tests:
          - not_null
      - name: invoice_doc
        description: Número de documento de la factura aplicada al pago.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_invoice')
                field: invoice_doc
      - name: application_type
        description: Tipo de aplicación (factura o nota de crédito).
        data_tests:
          - accepted_values:
              arguments:
                values: ['payment', 'credit_memo']
      - name: application_rule
        description: Regla utilizada para determinar la aplicación del pago (one_invoice, one_payment, etc.).
        data_tests:
          - accepted_values:
              arguments:
                values: [one_invoice, one_payment, credit_memo, waterfall]
  - name: dim_date
    description: Una fila por fecha
    columns:
      - name: date_day
        description: Día de la fecha.
        data_tests:
          - not_null
          - unique
      - name: is_month_end
        description: flag para saber si es el ultimo dia del mes
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
  - name: fact_ar_snapshot
    description: una fila por cliente y fecha con los datos de la cartera del cliente en ese momento
    columns:
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: snapshot_date
        description: fecha del snapshot
        data_tests:
          - not_null
      - name: credit_limit
        description: limite de credito del cleinte en el dia del snapshot
        data_tests:
          - not_null
  - name: fact_web_order
    description: Una fila por pedido del e-commerce, con el saldo del cliente ese día y las retenciones aplicadas.
    columns:
      - name: order_id
        description: Identificador del pedido en el e-commerce.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id