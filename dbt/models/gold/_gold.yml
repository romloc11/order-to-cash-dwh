version: 2

models:
  - name: dim_customer
    description: Una fila por cliente, con crédito, plazo de pago, distrito y cobrador.
    columns:
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - unique
          - not_null
      - name: collector_name
        description: Nombre del cobrador asignado al cliente, desde erp_employees.
        data_tests:
          - not_null
      - name: payment_terms_days
        description: Días de plazo de pago del cliente, desde erp_payment_terms.
        data_tests:
          - not_null
  - name: dim_customer_credit_history
    description: Una fila por cliente y versión de crédito, con fecha de vigencia (SCD2).
    columns:
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: valid_from
        description: Fecha desde la cual es válida la versión de crédito.
        data_tests:
          - not_null
      - name: valid_to
        description: Fecha hasta la cual es válida la versión de crédito.
        data_tests:
          - not_null
      - name: is_current
        description: Indica si la versión de crédito es la actual (1) o no (0).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
  - name: fact_invoice
    description: Una fila por factura, con cliente, fecha, importe y moneda.
    columns:
      - name: invoice_doc
        description: Número de documento de la factura en el ERP.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: invoice_date
        description: Fecha de la factura.
        data_tests:
          - not_null
      - name: invoice_amount
        description: Importe total de la factura en la moneda original.
        data_tests:
          - not_null
      - name: currency
        description: Código de moneda de la factura (ISO 4217).
        data_tests:
          - not_null
      - name: aging_bucket
        description: Categoría de antigüedad de la factura según su fecha y la fecha de corte.
        data_tests:
          - accepted_values:
              arguments:
                values: ['cleared', 'not_due', '1-15', '16-30', '31-60', '60+']