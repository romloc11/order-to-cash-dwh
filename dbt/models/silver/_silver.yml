version: 2

models:
  - name: erp_customers
    description: Una fila por cuenta de cliente del ERP, limpia, desde bronze.erp_kna1.
    columns:
      - name: customer_id
        description: Número de cliente del ERP como entero, sin ceros a la izquierda.
        data_tests:
          - unique
          - not_null
      - name: account_group
        data_tests:
          - accepted_values:
              arguments:
                values: [CUST, DELV]
  - name: erp_customer_credit
    description: Una fila por cuenta de cliente del ERP, con su límite de crédito y si está bloqueada o no, desde bronze.erp_knkk.
    columns:
      - name: customer_id
        description: ID del cliente en el ERP.
        data_tests:
          - unique
          - not_null
      - name: is_credit_blocked
        description: Indica si el cliente tiene el crédito bloqueado.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
  - name: crm_partners
    description: Una fila por cuenta de cliente del CRM, limpia, desde bronze.crm_res_partner.
    columns:
      - name: partner_id
        description: ID del cliente en el CRM.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('erp_customers')
                field: customer_id
  - name: ecommerce_orders
    description: Una fila por pedido de e-commerce, limpia, desde bronze.ecommerce_orders.
    columns:
      - name: order_id
        description: ID del pedido en el sistema de e-commerce.
        data_tests:
          - unique
          - not_null
      - name: status
        description: Estado del pedido.
        data_tests:
          - accepted_values:
              arguments:
                values: [confirmed, held, cancelled]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('erp_customers')
                field: customer_id
  - name: ecommerce_order_holds
    description: Una fila por retención de pedido. released_at nulo significa retención activa.
    columns:
      - name: hold_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('ecommerce_orders')
                field: order_id
      - name: hold_reason
        data_tests:
          - accepted_values:
              arguments:
                values: [ERP_BLOCK, CREDIT_LIMIT, OVERDUE_BALANCE]
  - name: erp_billing
    description: Una fila por factura emitida (VBRK).
    columns:
      - name: billing_doc
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('erp_customers')
                field: customer_id
  - name: erp_open_items
    description: Partidas abiertas de clientes (BSID). El importe siempre es positivo; debit_credit da la dirección.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('erp_customers')
                field: customer_id
      - name: debit_credit
        data_tests:
          - accepted_values:
              arguments:
                values: [S, H]
  - name: erp_cleared_items
    description: Partidas compensadas de clientes (BSAD), con fecha y documento de compensación.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('erp_customers')
                field: customer_id
      - name: debit_credit
        data_tests:
          - accepted_values:
              arguments:
                values: [S, H]
      - name: clearing_document
        data_tests:
          - not_null
  - name: erp_change_headers
    description: Encabezados de la bitácora de cambios de clientes (CDHDR).
    columns:
      - name: customer_id
        data_tests:
          - not_null
  - name: erp_change_items
    description: Detalle de la bitácora de cambios (CDPOS), campo por campo.
    columns:
      - name: field_name
        data_tests:
          - accepted_values:
              arguments:
                values: [CRBLB, KLIMK, PERNR, BZIRK]
  - name: erp_payment_terms
    columns:
      - name: payment_terms_code
        data_tests:
          - unique
          - not_null
  - name: erp_employees
    columns:
      - name: employee_id
        data_tests:
          - unique
          - not_null
  - name: crm_users
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null
  - name: crm_collection_activities
    columns:
      - name: activity_id
        data_tests:
          - unique
          - not_null
      - name: partner_id
        data_tests:
          - relationships:
              arguments:
                to: ref('crm_partners')
                field: partner_id
