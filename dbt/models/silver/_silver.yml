version: 2

models:
  - name: erp_customers
    description: One row per ERP customer account, cleaned, from bronze.erp_kna1.
    columns:
      - name: customer_id
        description: ERP customer number as an integer, without leading zeros.
        data_tests:
          - unique
          - not_null
      - name: account_group
        data_tests:
          - accepted_values:
              arguments:
                values: [CUST, DELV]
  - name: erp_customer_credit
    description: One row per ERP customer account, with its credit limit and whether credit is blocked, from bronze.erp_knkk.
    columns:
      - name: customer_id
        description: Customer ID in the ERP.
        data_tests:
          - unique
          - not_null
      - name: is_credit_blocked
        description: 1 if the customer's credit is blocked, 0 otherwise.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
  - name: crm_partners
    description: One row per CRM customer account, cleaned, from bronze.crm_res_partner.
    columns:
      - name: partner_id
        description: Customer ID in the CRM.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('erp_customers')
                field: customer_id
  - name: ecommerce_orders
    description: One row per e-commerce order, cleaned, from bronze.ecommerce_orders.
    columns:
      - name: order_id
        description: Order ID in the e-commerce system.
        data_tests:
          - unique
          - not_null
      - name: status
        description: Order status, confirmed, held or cancelled.
        data_tests:
          - accepted_values:
              arguments:
                values: [confirmed, held, cancelled]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('erp_customers')
                field: customer_id
  - name: ecommerce_order_holds
    description: One row per order hold. A NULL released_at means the hold is still active.
    columns:
      - name: hold_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('ecommerce_orders')
                field: order_id
      - name: hold_reason
        data_tests:
          - accepted_values:
              arguments:
                values: [ERP_BLOCK, CREDIT_LIMIT, OVERDUE_BALANCE]
  - name: erp_billing
    description: One row per issued invoice (VBRK).
    columns:
      - name: billing_doc
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('erp_customers')
                field: customer_id
  - name: erp_open_items
    description: Open customer items (BSID). The amount is always positive; debit_credit gives the direction.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('erp_customers')
                field: customer_id
      - name: debit_credit
        data_tests:
          - accepted_values:
              arguments:
                values: [S, H]
  - name: erp_cleared_items
    description: Cleared customer items (BSAD), with clearing date and clearing document.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('erp_customers')
                field: customer_id
      - name: debit_credit
        data_tests:
          - accepted_values:
              arguments:
                values: [S, H]
      - name: clearing_document
        data_tests:
          - not_null
  - name: erp_change_headers
    description: Customer change log headers (CDHDR).
    columns:
      - name: customer_id
        data_tests:
          - not_null
  - name: erp_change_items
    description: Change log items (CDPOS), field by field.
    columns:
      - name: field_name
        data_tests:
          - accepted_values:
              arguments:
                values: [CRBLB, KLIMK, PERNR, BZIRK]
  - name: erp_payment_terms
    columns:
      - name: payment_terms_code
        data_tests:
          - unique
          - not_null
  - name: erp_employees
    columns:
      - name: employee_id
        data_tests:
          - unique
          - not_null
  - name: crm_users
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null
  - name: crm_collection_activities
    columns:
      - name: activity_id
        data_tests:
          - unique
          - not_null
      - name: partner_id
        data_tests:
          - relationships:
              arguments:
                to: ref('crm_partners')
                field: partner_id
